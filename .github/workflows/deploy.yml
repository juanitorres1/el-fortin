name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # cada 1 h: estadísticas de jugadores, sanciones, snapshot e historial
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # sin dependencias: no hay nada que cachear
      - run: npm test
      - run: npm run data
      - name: Armar sitio
        run: |
          mkdir _site
          cp -r index.html css js assets data _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
