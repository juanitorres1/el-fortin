name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Estadísticas de jugadores, Vélez en cifras, asistidores, sanciones, titulares, snapshot e historial. Se pide cada
    # 15 min porque GitHub demora y saltea corridas programadas: con «cada 1 h» corría cada 3 a 5 h (oct-2026).
    # Son ~1,5 min por corrida, gratis en un repo público.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # para bajar el artifact del resumen semanal
  issues: write # para avisar si el chequeo de datos encuentra problemas
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Miniaturas de las noticias: ImageMagick suele venir en el runner; si no, se instala (unos segundos).
      - name: ImageMagick
        run: command -v magick || command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      # Las miniaturas ya generadas se reusan entre deploys: solo se procesan las notas nuevas.
      - uses: actions/cache@v6
        with:
          path: public/data/generated/img/news
          key: news-thumbs-${{ github.run_id }}
          restore-keys: news-thumbs-
      # Las asistencias ya leídas de cada partido también: solo se piden los partidos nuevos (scripts/update-data.mjs).
      - uses: actions/cache@v6
        with:
          path: public/data/generated/cache
          key: asistencias-${{ github.run_id }}
          restore-keys: asistencias-
      - run: npm run data
      # El resumen con IA lo genera news-summary.yml (todos los días, si hay notas nuevas). Se baja el artifact más nuevo
      # (no el de la última corrida: las que no tienen notas nuevas terminan sin resumen). Si no hay o venció (30 días),
      # la página muestra solo los titulares.
      - name: Bajar el último resumen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=resumen-semanal&per_page=20" -q '[.artifacts[] | select(.expired == false)][0].workflow_run.id')
          if [ -n "$RUN" ]; then
            gh run download "$RUN" --repo "${{ github.repository }}" -n resumen-semanal -D public/data/generated || echo "No se pudo bajar el resumen de la corrida $RUN"
          else
            echo "Todavía no hay resumen"
          fi
      # Si algo quedó vacío o el reglamento es de otra temporada, abre (o actualiza) un issue; si está todo bien, lo
      # cierra. No frena el deploy.
      - name: Chequear datos
        id: health
        continue-on-error: true
        run: node scripts/check-data.mjs "$RUNNER_TEMP/health.md"
      - name: Avisar por issue
        if: steps.health.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Revisar datos del sitio'
        run: |
          ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ "${{ steps.health.outputs.problems }}" != "0" ]; then
            if [ -n "$ISSUE" ]; then gh issue edit "$ISSUE" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/health.md"
            else gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file "$RUNNER_TEMP/health.md"; fi
          elif [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --repo "${{ github.repository }}" --comment "Resuelto: el último deploy no encontró problemas."
          fi
      # React + Vite: arma dist/ con las 5 páginas y lo que hay en public/, y prerenderiza cada página con los datos
      # recién bajados (el contenido se ve sin esperar a React ni a ESPN; después se actualiza en vivo).
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
