name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # cada 1 h: estadísticas de jugadores, sanciones, titulares, snapshot e historial
  workflow_dispatch:

permissions:
  contents: read
  actions: read # para bajar el artifact del resumen semanal
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # sin dependencias: no hay nada que cachear
      - run: npm test
      # Miniaturas de las noticias: ImageMagick suele venir en el runner; si no, se instala (unos segundos).
      - name: ImageMagick
        run: command -v magick || command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      # Las miniaturas ya generadas se reusan entre deploys: solo se procesan las notas nuevas.
      - uses: actions/cache@v6
        with:
          path: data/generated/img/news
          key: news-thumbs-${{ github.run_id }}
          restore-keys: news-thumbs-
      - run: npm run data
      # El resumen con IA se genera los lunes (news-weekly.yml); acá se baja el último que salió bien.
      # Si todavía no hay o venció (30 días), la página muestra solo los titulares.
      - name: Bajar el último resumen semanal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --repo "${{ github.repository }}" --workflow news-weekly.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN" ]; then
            gh run download "$RUN" --repo "${{ github.repository }}" -n resumen-semanal -D data/generated || echo "No se pudo bajar el resumen de la corrida $RUN"
          else
            echo "Todavía no hay resumen semanal"
          fi
      - name: Armar sitio
        run: |
          mkdir _site
          cp -r *.html css js assets data _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
